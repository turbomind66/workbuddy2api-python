name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    value: |
      感谢你的建议！请注意：本项目是 Go 原版的 Python 重写，
      **核心原则是保持与 Go 原版逻辑对等**，偏离原版行为的建议需要额外说明理由。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么不便？目前是如何绕过的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望怎么实现？
    validations:
      required: true

  - type: dropdown
    id: align-go
    attributes:
      label: 与 Go 原版是否一致
      options:
        - 是（Go 原版已有该功能）
        - 否（Python 版新增，需要说明理由）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你还考虑过哪些其他做法？
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
